# Builds the Next.js static export and deploys it to Cloudflare Pages with Wrangler.
#
# Deploys only run for pushes to `main` (production, using .env.production) or
# `staging` (using .env.staging). Wrangler's --branch flag is passed the pushed
# branch name, so Cloudflare Pages treats `main` as the production deployment
# and `staging` as a preview deployment aliased at the "staging" subdomain.
# Other branches still build (as a CI sanity check) but are not deployed.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   – token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  – your Cloudflare account ID
#
# The Pages project name defaults to "zeno-xaman"; override via CF_PAGES_PROJECT below.

name: Build and Deploy

on:
  push:
    branches:
      - "**"

env:
  CF_PAGES_PROJECT: zeno-xaman

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Select environment file
        # Next.js loads .env.production automatically for `next build`. On the
        # staging branch, overlay .env.staging via .env.production.local (which
        # takes precedence) so the staging API keys get baked into that build.
        run: |
          if [ "${{ github.ref_name }}" = "staging" ]; then
            cp .env.staging .env.production.local
          fi

      - name: Build
        run: bun run build

      - uses: actions/upload-artifact@v4
        with:
          name: out
          path: out/
          retention-days: 7

  deploy:
    needs: build
    if: contains(fromJSON('["main", "staging"]'), github.ref_name)
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: out
          path: out

      - name: Deploy to Cloudflare Pages
        run: >-
          npx --yes wrangler pages deploy out
          --project-name "$CF_PAGES_PROJECT"
          --branch "${{ github.ref_name }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
