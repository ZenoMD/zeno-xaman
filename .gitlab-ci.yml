# Builds the Next.js static export and deploys it to Cloudflare Pages with Wrangler.
#
# Required CI/CD variables (Settings → CI/CD → Variables), both "Masked":
#   CLOUDFLARE_API_TOKEN   – token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  – your Cloudflare account ID
#
# The Pages project name defaults to "zeno-xaman"; override via CF_PAGES_PROJECT.

stages:
  - build
  - deploy

variables:
  CF_PAGES_PROJECT: zeno-xaman

build:
  stage: build
  image: oven/bun:1
  # Cache Bun's global module cache, keyed on the lockfile.
  cache:
    key:
      files:
        - bun.lock
    paths:
      - .bun-cache/
  script:
    - bun install --frozen-lockfile
    # `bun run build` runs the prebuild copy-wasm step, then `next build`, which
    # statically exports the site to out/ (output: "export").
    - bun run build
  variables:
    BUN_INSTALL_CACHE_DIR: .bun-cache
  artifacts:
    paths:
      - out/
    expire_in: 1 week

deploy:
  stage: deploy
  image: node:20
  needs:
    - build
  script:
    - >-
      npx --yes wrangler pages deploy out
      --project-name "$CF_PAGES_PROJECT"
      --branch "$CI_COMMIT_REF_NAME"
  environment:
    name: cloudflare-pages
  rules:
    # Production deploy only from the default branch; other branches build but don't deploy.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
