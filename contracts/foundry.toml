[profile.default]
src = "src"
out = "out"
libs = ["lib"]

remappings = [
    '@axelar-network/interchain-token-service/=lib/interchain-token-service/contracts/',
    '@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/',
    '@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/',
    '@railgun/=lib/railgun-contracts/contracts/'
]
